    <style>
      /* Painted before CSS/JS arrive so the first frame is never a white flash. */
      html, body { background-color: #070B14; margin: 0; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px; font-family: Inter, system-ui, sans-serif;
        color: #64748B; font-size: 12px; letter-spacing: .18em; text-transform: uppercase;

      #boot span { width: 30px; height: 30px; border-radius: 9999px; border: 2px solid #1E2F4D; border-top-color: #22D3EE; animation: bootspin .8s linear infinite; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
